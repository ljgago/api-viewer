version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: build_noncgo
    main: .
    binary: api-viewer
    ldflags:
      - -s -w
        -X github.com/ljgago/api-viewer/cmd.version={{ .Version }}
        -X github.com/ljgago/api-viewer/cmd.commit={{ .Commit }}
        -X github.com/ljgago/api-viewer/cmd.buildDate={{ .Date }}
        -X github.com/ljgago/api-viewer/cmd.system={{ .Runtime.Goos }}
        -X github.com/ljgago/api-viewer/cmd.arch={{ .Runtime.Goarch }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm

archives:
  - id: archive_noncgo
    ids: [build_noncgo]
    formats: zip
    format_overrides:
      - goos: linux
        format: tar.gz
    files:
      - LICENSE
      - CHANGELOG.md
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
